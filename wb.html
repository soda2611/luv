<!DOCTYPE html>
<html>
    <head>
        <title>luv</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="luv">
        <meta property="og:description" content="góc riêng của ngha và hmn">
        <meta property="og:image" content="images/avt.png">
        <meta property="og:url" content="https://soda2611.github.io/cv">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="resources/img/Icon.png" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Coiny&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="script.js" defer></script>
        <script src="wb.js" defer></script>
    </head>
    <body>
        <div style="position: absolute; width: 90%; height: calc(100% - 1.5rem); display:flex; flex-direction: column; gap: var(--spacing);">
            <div id="header">
                <a href="index.html">💖 <b>ngha và hmn</b></a>
                <span style="display: flex; flex-grow: 1"></span>
                <span id="date-counter">☀️ &lt3 ⭐</span>
                <button id="wb-list-btn" style="background:var(--btn-color); color:var(--bg-color); border-radius:8px; padding:6px 10px; border:none; margin-right:8px;">Boards</button>
                <a onclick="openNav()" id="id-tag">id</a>
            </div>

            <div id="wb-scroll"><div id="whiteboard"></div></div>
            
            <div style="display: none; justify-content: center; width: 100%; position: relative;">
                <div id="wb-toolbar">
                    <div style="position: relative; display: flex; overflow-x: auto; border-radius: 10rem; height: fit-content; width: fit-content; max-width: 350px; gap: 1rem;">
                        <button style="display: flex; align-items: center;"><i class="material-icons" style="position: relative; font-size: 1.75rem;">touch_app</i></button>
                        <button style="display: flex; align-items: center;"><i class="material-icons" style="position: relative; font-size: 1.75rem;">gesture</i></button>
                        <button style="display: flex; align-items: center;"><i class="material-icons" style="position: relative; font-size: 1.75rem;">sticky_note_2</i></button>
                        <button style="display: flex; align-items: center;"><i class="material-icons" style="position: relative; font-size: 1.75rem;">lock</i></button>
                    </div>
                </div>
            </div>

            <div id="wb-list-panel" style="display:none; flex-grow:1; background: var(--ctn-color); border-radius: 1.5rem; padding:1rem; overflow:auto; display:flex; flex-direction:column;">
                <div id="wb-list" style="display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 100px);overflow:auto;margin-bottom:8px;"></div>
                <!--<div style="display:flex;gap:8px; flex-wrap:wrap; align-items:center;">
                    <input id="wb-new-name" placeholder="Tên whiteboard..." style="flex:1; min-width:120px;">
                    <button id="wb-create">Tạo</button>
                    <button id="wb-list-close">Đóng</button>
                </div>-->
            </div>
        </div>

        <div id="date-modal" class="modal">
            <div class="modal-box">
                <h3>Chọn ngày</h3>
                <input id="datePicker" placeholder="Chọn ngày">
                <button onclick="confirmDate()">Xem</button>
            </div>
        </div>
        
        <div id="uid-modal" class="modal">
            <div class="modal-box">
                <h3>Đổi UID</h3>
                <input id="uid-input" placeholder="Nhập UID...">
                <button onclick="saveUID()">Lưu</button>
            </div>
        </div>

        <div id="sidenav" class="sidenav">
            <a id="close" class="closebtn" onclick="closeNav()">&times;</a>
            <a href="wl.html">Wishlist<i class="material-icons" style="position: relative; font-size: 1.25rem; top: 0">auto_awesome</i></a>
            <a href="wb.html">Whiteboard<i class="material-icons" style="position: relative; font-size: 1.25rem; top: 0">gesture</i></a>
            <div style="padding-left: 1.5rem; padding-right: 1.5rem; width: 90%;"><hr></div>
            <a onclick="openDatePicker()" style="gap: var(--spacing); text-align: center"><i class="material-icons" style="position: relative; font-size: 2rem;">history</i>Xem tin nhắn cũ</a>
            <a onclick="openUIDModal()" style="gap: var(--spacing); text-align: center"><i class="material-icons" style="position: relative; font-size: 2rem;">person</i>Đổi UID</a>
        </div>
    </body>
</html>
