<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>nhom nhom nhom</title>
	<link rel="stylesheet" href="date.css">
	<style>
		#days-counter {
			display: inline-block;
			min-width: 120px;
		}
		.progress-bar {
			width: 100%;
			height: 8px;
			background: rgba(255,255,255,0.2);
			border-radius: 10px;
			overflow: hidden;
			margin: 1rem 0;
		}
		.progress-fill {
			height: 100%;
			background: linear-gradient(90deg, #ff6b9a, #ff9db9);
			border-radius: 10px;
			transition: width 0.3s ease;
		}
		.info-row {
			display: flex;
			justify-content: space-around;
			gap: 1rem;
			margin: 1rem 0;
			flex-wrap: wrap;
		}
		.info-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5rem;
		}
		.info-number {
			font-size: 1.5rem;
			font-weight: bold;
			color: #ff6b9a;
		}
		.info-label {
			font-size: 0.85rem;
			opacity: 0.8;
		}
		.milestone {
			color: #ffd700;
			font-weight: bold;
			margin-top: 0.5rem;
			font-size: 0.95rem;
		}
	</style>
</head>
<body>
	<div class="scene">
        <div id="hearts" aria-hidden="true"></div>
        
		<div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);padding:30px;border-radius:20px;color:#fff;text-align:center;max-width:500px;">
			<div id="header">
                <h1><a href="index.html"><b>💕ngha và hmn</b></a></h1>
            </div>
			<p style="font-size:1rem;margin:0;">đã bên nhau</p>
			<div style="font-size:3rem;font-weight:bold;color:#ff6b9a;" id="days-counter">0</div>
			<h2 style="margin:0;">ngày</h2>
			<div class="milestone" id="milestone"></div>
			
			<div class="info-row">
				<div class="info-item">
					<div class="info-number" id="years">0</div>
					<div class="info-label">năm</div>
				</div>
				<div class="info-item">
					<div class="info-number" id="weeks">0</div>
					<div class="info-label">tuần</div>
				</div>
				<div class="info-item">
					<div class="info-number" id="remaining-days">0</div>
					<div class="info-label">ngày</div>
				</div>
			</div>

			<div class="progress-bar">
				<div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
			</div>
			<div class="info-item">
				<span class="info-label"><span class="info-number" id="until-year">0</span> ngày nữa là tròn <span class="info-number" id="milestone-year">1</span> năm</span>
			</div>
		</div>
		
        <div class="controls" style="display: none;">
            <label>Density: <input id="density" type="range" min="1" max="50" value="1"></label>
			<button id="toggle">Pause</button>
		</div>
	</div>
    
	<script src="date.js"></script>
	<script src="script.js"></script>
</body>
</html>
