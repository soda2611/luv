<!DOCTYPE html>
<html>
    <head>
        <title>luv</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="luv">
        <meta property="og:description" content="góc riêng của ngha và hmn">
        <meta property="og:image" content="images/avt.png">
        <meta property="og:url" content="https://soda2611.github.io/cv">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="resources/img/Icon.png" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Coiny&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="script.js" defer></script>
        <script src="wl.js" defer></script>
    </head>
    <body>
        <div style="position: absolute; width: 90%; height: calc(100% - 1.5rem); display:flex; flex-direction: column; gap: var(--spacing);">
            <div id="header">
                <a href="index.html">💖 <b>ngha và hmn</b></a>
                <span style="display: flex; flex-grow: 1"></span>
                <span id="date-counter">☀️ &lt3 ⭐</span>
                <a onclick="openNav()" id="id-tag">id</a>
            </div>

            <div style="display: flex; flex-grow: 1; overflow-y: auto; padding: var(--spacing)"><div id="wishlist-list"></div></div>

            <div id="wl-form">
                <div style="position: relative; display: flex; flex-direction: column; overflow-y: auto; height: 10rem; gap: 1rem;">
                    <span style="display: flex; align-items: center;"><i class="material-icons-outlined" style="position: relative; font-size: 1.75rem;">favorite_border</i><input id="wl-content" placeholder="Thêm điều ước nè <3"></span>
                    <span style="display: flex; align-items: center;"><i class="material-icons-outlined" style="position: relative; font-size: 1.75rem;">sell</i><input id="wl-category" placeholder="Danh mục"></span>
                    <span style="display: flex; align-items: center;"><i class="material-icons-outlined" style="position: relative; font-size: 1.75rem;">sticky_note_2</i><input id="wl-note" placeholder="Ghi chú"></span>
                    <span style="display: flex; align-items: center;"><i class="material-icons-outlined" style="position: relative; font-size: 1.75rem;">link</i><input id="wl-link" placeholder="Link"></span>
                    <span style="display: flex; align-items: center; gap: var(--spacing)"><span id="priority-value">🌹 Mức ưu tiên: 3</span><input id="wl-priority" type="range" min="1" max="5" value="3" style="flex: 1;" oninput="updatePriorityLabel(this.value)"></span>
                </div>
                <button style="width: 100%; border-radius: 10rem; border: none; padding: 0.75rem; background-color: var(--btn-color); color: var(--bg-color)" onclick="handleCreateWL()">Lưu</button>
            </div>

            </div>
        </div>

        <div id="date-modal" class="modal">
            <div class="modal-box">
                <h3>Chọn ngày</h3>
                <input id="datePicker" placeholder="Chọn ngày">
                <button onclick="confirmDate()">Xem</button>
            </div>
        </div>
        
        <div id="uid-modal" class="modal">
            <div class="modal-box">
                <h3>Đổi UID</h3>
                <input id="uid-input" placeholder="Nhập UID...">
                <button onclick="saveUID()">Lưu</button>
            </div>
        </div>

        <div id="sidenav" class="sidenav">
            <a id="close" class="closebtn" onclick="closeNav()">&times;</a>
            <a href="wl.html">Wishlist<i class="material-icons" style="position: relative; font-size: 1.25rem; top: 0">auto_awesome</i></a>
            <a href="wb.html">Whiteboard<i class="material-icons" style="position: relative; font-size: 1.25rem; top: 0">gesture</i></a>
            <div style="padding-left: 1.5rem; padding-right: 1.5rem; width: 90%;"><hr></div>
            <a onclick="openDatePicker()" style="gap: var(--spacing); text-align: center"><i class="material-icons" style="position: relative; font-size: 2rem;">history</i>Xem tin nhắn cũ</a>
            <a onclick="openUIDModal()" style="gap: var(--spacing); text-align: center"><i class="material-icons" style="position: relative; font-size: 2rem;">person</i>Đổi UID</a>
        </div>
    </body>
</html>
